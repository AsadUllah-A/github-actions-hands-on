name: Module 6C - Service Containers

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  postgres-job:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify PostgreSQL Container Connection
        run: |
          PGPASSWORD=password123 psql -h localhost -U postgres -d testdb -c "SELECT 'PostgreSQL Service Container is Ready!' AS status;"