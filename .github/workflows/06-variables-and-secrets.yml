name: Module 4 - Variables and Encrypted Secrets

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  secrets-job:
    runs-on: ubuntu-latest
    steps:
      - name: Access Repository Variables
        run: |
          echo "Application Environment: ${{ vars.APP_ENV }}"

      - name: Safely Access Encrypted Secrets
        env:
          MY_SECRET_VAL: ${{ secrets.MY_SECRET }}
        run: |
          echo "Printing secret securely (GitHub will automatically mask it):"
          echo "Secret value is: $MY_SECRET_VAL"

      - name: Test GITHUB_TOKEN Authentication
        run: |
          echo "Auto-generated GITHUB_TOKEN is present and authenticated."
          echo "Token length: ${#GITHUB_TOKEN}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}